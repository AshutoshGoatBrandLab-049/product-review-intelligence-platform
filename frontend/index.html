<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Review Intelligence</title>
    <script>
      // Applied synchronously, before React mounts, so there is no flash of
      // the wrong theme on load. Kept in exact sync with the storage key
      // and resolution logic in src/providers/ThemeProvider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          // localStorage/matchMedia unavailable (e.g. a locked-down test
          // environment) — fall back to light, never throw before mount.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
